<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aggiornamento GUI</title>
<noscript><meta http-equiv="refresh" content="5;url=/"></noscript>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#f8fafc;padding:16px}
.c{width:100%;max-width:450px;background:#1e293b;border:1px solid #334155;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.4);padding:28px 24px;text-align:center}
.hd{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}
.sp{width:20px;height:20px;border:3px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
h1{font-size:19px;font-weight:600;color:#f1f5f9}
p{font-size:13.5px;color:#94a3b8;margin-bottom:20px}
.b{height:12px;background:#0f172a;border:1px solid #334155;border-radius:99px;overflow:hidden;margin-bottom:12px}
.b i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0284c7,#38bdf8);transition:width .4s ease}
.mt{display:flex;justify-content:space-between;font-size:13px;color:#cbd5e1;gap:8px}
#m{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#v{font-weight:700;color:#38bdf8;font-variant-numeric:tabular-nums}
.e{border-color:#ef4444}
.e .b i{background:#ef4444}
.e h1{color:#f87171}
a{color:#38bdf8;margin-left:6px;text-decoration:none}
a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="c" id="c">
  <div class="hd">
    <div class="sp" id="s"></div>
    <h1 id="t">Aggiornamento GUI in corso</h1>
  </div>
  <p id="d">Non spegnere il router. La pagina si aggiorna automaticamente.</p>
  <div class="b"><i id="p"></i></div>
  <div class="mt">
    <span id="m">Inizializzazione...</span>
    <span id="v">0%</span>
  </div>
</div>
<script>
(function(){
  function g(i){return document.getElementById(i)}
  var p=g("p"),m=g("m"),v=g("v"),c=g("c"),s=g("s"),mx=0,f=0;
  if(!/^it/i.test(navigator.language||"")){
    g("t").textContent="GUI Upgrade in progress";
    g("d").textContent="Do not power off the router. This page will reload automatically.";
  }
  function nx(){setTimeout(tk,1000)}
  function ko(){f++;if(f>2&&mx>=50)pr();else nx()}
  function pr(){
    var x=new XMLHttpRequest();
    x.open("GET","/login.lp?_="+Date.now());
    x.timeout=4000;
    x.onload=function(){
      if(x.status==200)location.replace("/login.lp");
      else nx();
    };
    x.onerror=x.ontimeout=nx;
    x.send();
  }
  function tk(){
    var x=new XMLHttpRequest();
    x.open("GET","/gui_progress.json?_="+Date.now());
    x.timeout=4000;
    x.onload=function(){
      var j=null;
      try{j=JSON.parse(x.responseText)}catch(e){}
      if(x.status!=200||!j)return ko();
      f=0;
      var n=+j.pct||0;
      if(n>mx)mx=n>100?100:n;
      p.style.width=mx+"%";
      v.textContent=mx+"%";
      if(j.msg)m.textContent=j.msg;
      if(j.step=="error"){
        c.className="c e";
        s.style.display="none";
        var a=document.createElement("a");
        a.href="/login.lp";
        a.textContent="[Riprova]";
        m.appendChild(a);
        return;
      }
      if(j.step=="done"||mx>=100){
        s.style.borderTopColor="#22c55e";
        return setTimeout(pr,1200);
      }
      nx();
    };
    x.onerror=x.ontimeout=ko;
    x.send();
  }
  tk();
})();
</script>
</body>
</html>
