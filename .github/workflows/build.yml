name: Build & Release GUI

on:
  push:
    branches:
      - master
      - stable
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish / Update GitHub Release'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GUI Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bzip2 dos2unix zip python3

      - name: Fix file line endings
        run: |
          echo "Scanning and normalizing line endings with dos2unix..."
          find decompressed -type f -exec dos2unix -q {} +

      - name: Determine version
        id: version
        run: |
          SHORT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "dev")
          echo "SHORT_HASH=${SHORT_HASH}" >> $GITHUB_ENV
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            IS_TAG="true"
          else
            DEFAULT_VER=$(grep -oE 'version_gui=[0-9]+\.[0-9]+\.[0-9]+' decompressed/base/etc/init.d/rootdevice | cut -d= -f2 || echo "9.7.9")
            VER="${DEFAULT_VER}"
            IS_TAG="false"
          fi
          
          FULL_VER="${VER}-${SHORT_HASH}"
          echo "VERSION=${VER}" >> $GITHUB_ENV
          echo "FULL_VER=${FULL_VER}" >> $GITHUB_ENV
          echo "IS_TAG=${IS_TAG}" >> $GITHUB_ENV
          echo "Building GUI version: ${FULL_VER}"

      - name: Build DEV GUI package (.tar.bz2 & .zip)
        run: |
          chmod +x inizialize_gui.sh
          VERSION="${FULL_VER}" ./inizialize_gui.sh dev

      - name: Build STABLE GUI package (.tar.bz2 & .zip)
        run: |
          VERSION="${FULL_VER}" ./inizialize_gui.sh

      - name: Generate Checksums
        run: |
          cd compressed
          md5sum GUI*.tar.bz2 GUI*.zip > MD5SUMS
          sha256sum GUI*.tar.bz2 GUI*.zip > SHA256SUMS
          echo "=== MD5SUMS ==="
          cat MD5SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Generate Release Notes & Changelog
        run: |
          python3 - << 'EOF'
          import os, re

          version = os.environ.get("VERSION", "9.7.9")
          full_ver = os.environ.get("FULL_VER", version)
          commit = os.environ.get("SHORT_HASH", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "ZioCook/tch-nginx-gui")

          changelog_notes = []
          try:
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  lines = f.readlines()
              
              in_ver = False
              for line in lines:
                  s = line.strip()
                  if s == version or s.startswith(version):
                      in_ver = True
                      continue
                  if in_ver:
                      # Stop when encountering next version header (e.g. 9.6.65) or mainline header
                      if (re.match(r'^[0-9]+\.[0-9]+', s) and not s.startswith(version)) or s.startswith("# Mainline"):
                          if len(changelog_notes) > 1:
                              break
                      if not s.startswith("---") and s:
                          changelog_notes.append(s)
          except Exception as e:
              changelog_notes = [f"- Modifiche e fix da commit {commit}"]

          changelog_text = "\n".join(changelog_notes) if changelog_notes else f"- Aggiornamenti da commit {commit}"

          body = f"""## 🚀 Technicolor Nginx GUI - Release {full_ver}

### 📝 Changelog per {version}
{changelog_text}

---

### 📦 Installazione Rapida (via SSH sul modem)
```bash
curl -k -L https://raw.githubusercontent.com/{repo}/master/compressed/GUI_dev.tar.bz2 --output /tmp/GUI.tar.bz2
bzcat /tmp/GUI.tar.bz2 | tar -C / -xvf -
/etc/init.d/rootdevice force
```

### 📁 File Disponibili
- **`GUI_dev.zip`** & **`GUI_dev.tar.bz2`**: Pacchetto di sviluppo con tutte le ultime funzionalità.
- **`GUI.zip`** & **`GUI.tar.bz2`**: Pacchetto stabile.
- **`MD5SUMS`** & **`SHA256SUMS`**: Checksum di integrità dei file.
"""

          with open("release_notes.md", "w", encoding="utf-8") as out:
              out.write(body)
          EOF

          cat release_notes.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-packages-${{ env.SHORT_HASH }}
          path: |
            compressed/GUI.tar.bz2
            compressed/GUI.zip
            compressed/GUI_dev.tar.bz2
            compressed/GUI_dev.zip
            compressed/MD5SUMS
            compressed/SHA256SUMS
            modular/*.tar.bz2
          retention-days: 30

      - name: Publish GitHub Release (Tags)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            compressed/GUI.tar.bz2
            compressed/GUI.zip
            compressed/GUI_dev.tar.bz2
            compressed/GUI_dev.zip
            compressed/MD5SUMS
            compressed/SHA256SUMS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish/Update Rolling Dev Release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Development Build (${{ env.FULL_VER }})
          body_path: release_notes.md
          files: |
            compressed/GUI.tar.bz2
            compressed/GUI.zip
            compressed/GUI_dev.tar.bz2
            compressed/GUI_dev.zip
            compressed/MD5SUMS
            compressed/SHA256SUMS
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
